name: Build

# Manual only: Windows runners bill at 2x, so builds run on demand
# (Actions tab > Run workflow) instead of on every push.
on:
  workflow_dispatch:

# A newer push supersedes any still-running build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The Windows job overrides this to contents:write
# because its build output is published as a draft GitHub Release asset rather
# than an actions/upload-artifact (same approach as SPASynth: the account-wide
# Actions artifact-storage quota is too small, and release assets don't count
# against it). The macOS job keeps the inherited read-only permission.
permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write # Azure OIDC login for code signing (inert while signing is dormant)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The licensing module lives in the PRIVATE repo meeglosh/spa-licensing.
      # SPA_LICENSING_TOKEN is a fine-grained, read-only PAT for that one repo.
      # Fail loudly without it: a release build must never ship unlicensed.
      # (The token is only ever passed to actions/checkout, never echoed, and
      # this workflow has no pull_request_target, so forks never see it.)
      - name: Require licensing token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.SPA_LICENSING_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Repository secret SPA_LICENSING_TOKEN is not set. It must be a fine-grained read-only PAT for meeglosh/spa-licensing (Contents: Read). Release builds refuse to build without the licensing module."
            exit 1
          fi

      - name: Read licensing pin
        id: licpin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < libs/spa-licensing.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out spa-licensing (private)
        uses: actions/checkout@v4
        with:
          repository: meeglosh/spa-licensing
          ref: ${{ steps.licpin.outputs.sha }}
          token: ${{ secrets.SPA_LICENSING_TOKEN }}
          path: libs/spa-licensing
          persist-credentials: false

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSPASTRIP_COPY_PLUGIN=OFF -DSPASTRIP_REQUIRE_LICENSING=ON -DSPASTRIP_SPA_LICENSING_DIR:PATH=libs/spa-licensing

      - name: Build (VST3 + tests)
        run: cmake --build build --config Release --parallel --target SPAStrip_VST3 SPAStripTests

      - name: Run tests
        shell: bash
        run: ./build/SPAStripTests_artefacts/Release/SPAStripTests.exe

      # ---- Windows code signing (Azure Artifact Signing) -- DORMANT until the
      # three AZURE_* secrets exist. Without them every step below that
      # mentions steps.sign.outputs.enabled is skipped and the build is
      # exactly the unsigned build it always was. Only main-branch runs sign
      # (pull requests and other branches stay unsigned, so the Azure
      # federated credential only needs the refs/heads/main subject).
      # Setup guide: docs/windows-signing.md in the spasynth repo.
      - name: Signing configuration
        id: sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ELIGIBLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ "$ELIGIBLE" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Windows code signing: ON"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows code signing is OFF (Azure secrets not set, or not a main-branch run). Building unsigned."
          fi

      - name: Azure login (OIDC)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Artifact Signing tools
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT || 'silverplatter-signing' }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE || 'silverplatter-public' }}
        run: ./scripts/windows-signing.ps1 -Action Setup

      - name: Sign plugin binaries
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $v = 'build/SPAStrip_artefacts/Release/VST3/SPAStrip.vst3/Contents/x86_64-win/SPAStrip.vst3'
          ./scripts/windows-signing.ps1 -Action Sign -Files $v
          ./scripts/windows-signing.ps1 -Action Verify -Files $v

      - name: Read version
        id: version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^project(SPAStrip VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # README/QUICKSTART with the version filled in, the EULA, and CREDITS.txt
      # (generated from assets/irs/CREDITS.md) for the installer to ship.
      # SPASTRIP_ALLOW_TODO: CI builds are not releases; the release script
      # (scripts/build_release.sh) is what refuses docs that still carry a TODO.
      - name: Prepare installer docs
        shell: bash
        env:
          SPASTRIP_ALLOW_TODO: "1"
        run: ./scripts/prepare_docs.sh build/docs "${{ steps.version.outputs.version }}"

      - name: Build installer (Windows)
        if: steps.sign.outputs.enabled != 'true'
        shell: cmd
        # /O (output dir) is resolved relative to the working directory (repo
        # root), NOT the .iss location like the Source paths, so use an
        # absolute workspace path or the publish step finds nothing.
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} /DArtefacts=..\..\build\SPAStrip_artefacts\Release /DDocsDir=..\..\build\docs /O"%GITHUB_WORKSPACE%\dist\installers" installers\windows\SPAStrip.iss'

      # Signed variant: same command plus an Inno SignTool definition so ISCC
      # signs the installer and the uninstaller. The VST3 was signed above.
      - name: Build installer (Windows, signed)
        if: steps.sign.outputs.enabled == 'true'
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} /DArtefacts=..\..\build\SPAStrip_artefacts\Release /DDocsDir=..\..\build\docs /DSignToolCmd=spasign "/Sspasign=%SPA_ISCC_SIGN_CMD%" /O"%GITHUB_WORKSPACE%\dist\installers" installers\windows\SPAStrip.iss'

      - name: Verify signed installer
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/windows-signing.ps1 -Action Verify -Files "dist/installers/*.exe"

      - name: Check installer name
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/installers/SPAStrip-${{ steps.version.outputs.version }}-Windows.exe"
          ls -l dist/installers

      # Publish the installer to a draft release rather than via
      # actions/upload-artifact (see the permissions note above). Drafts are
      # invisible to the public and their tag is not created as a real git ref
      # until published, so this never pushes a visible tag. Re-runs on the same
      # commit delete+recreate the draft (gh release view can't see drafts by
      # tag, only the list endpoint can, so existence is checked via
      # `gh api .../releases`). Skipped for pull requests from forks, whose
      # token is read-only.
      - name: Publish installer to draft release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="ci-windows-${SHORT_SHA}"
          EXE="$(ls "${GITHUB_WORKSPACE}"/dist/installers/*.exe)"
          NOTES="Automated Windows CI build from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA})."

          EXISTING_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)"
          if [ -n "$EXISTING_ID" ]; then
            echo "Draft release for ${TAG} already exists (id ${EXISTING_ID}) -- deleting before recreate."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
          fi

          gh release create "$TAG" "$EXE" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "CI Windows build ${{ steps.version.outputs.version }} @ ${SHORT_SHA}" \
            --notes "$NOTES"

      # Keep the last 5 CI draft releases and delete older ones so the draft
      # list doesn't grow unbounded. Only touches drafts matching the
      # ci-windows- prefix -- never a real, published release.
      - name: Prune old CI draft releases
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t OLD_IDS < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == true and (.tag_name | startswith("ci-windows-")))]
                  | sort_by(.created_at) | reverse | .[5:] | .[].id')
          for id in "${OLD_IDS[@]:-}"; do
            [ -n "$id" ] || continue
            echo "Pruning old CI draft release id ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

  macos:
    name: macOS (AU + VST3, universal)
    runs-on: macos-14
    # Manual only: macOS runners bill at 10x on a private repo (as in SPASynth).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The licensing module lives in the PRIVATE repo meeglosh/spa-licensing.
      # SPA_LICENSING_TOKEN is a fine-grained, read-only PAT for that one repo.
      # Fail loudly without it: a release build must never ship unlicensed.
      # (The token is only ever passed to actions/checkout, never echoed, and
      # this workflow has no pull_request_target, so forks never see it.)
      - name: Require licensing token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.SPA_LICENSING_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Repository secret SPA_LICENSING_TOKEN is not set. It must be a fine-grained read-only PAT for meeglosh/spa-licensing (Contents: Read). Release builds refuse to build without the licensing module."
            exit 1
          fi

      - name: Read licensing pin
        id: licpin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < libs/spa-licensing.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out spa-licensing (private)
        uses: actions/checkout@v4
        with:
          repository: meeglosh/spa-licensing
          ref: ${{ steps.licpin.outputs.sha }}
          token: ${{ secrets.SPA_LICENSING_TOKEN }}
          path: libs/spa-licensing
          persist-credentials: false

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPASTRIP_COPY_PLUGIN=OFF -DSPASTRIP_UNIVERSAL_BINARY=ON -DSPASTRIP_REQUIRE_LICENSING=ON -DSPASTRIP_SPA_LICENSING_DIR:PATH=libs/spa-licensing

      - name: Build (AU + VST3 + tests)
        run: cmake --build build --config Release --parallel

      - name: Check universal binaries
        run: |
          lipo -info build/SPAStrip_artefacts/Release/AU/SPAStrip.component/Contents/MacOS/SPAStrip
          lipo -info build/SPAStrip_artefacts/Release/VST3/SPAStrip.vst3/Contents/MacOS/SPAStrip

      - name: Run tests
        run: ./build/SPAStripTests_artefacts/Release/SPAStripTests
